name: Update code in ACL

permissions:
  id-token: write
  contents: read

# GitHub Environment (UAT, Production):
#   Variables: ACL_DEPLOYMENT_NAME
#   Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Runners: self-hosted `uat` | `prod`. App host: https://{ACL_DEPLOYMENT_NAME}.confidential-ledger.azure.com

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Target Environment"
        options:
          - UAT
          - Production
        default: Production
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Target Environment"
        default: Production

jobs:
  deploy:
    name: ACL app — ${{ inputs.environment }}
    runs-on: ${{ fromJSON((inputs.environment || 'Production') == 'UAT' && '["self-hosted", "uat"]' || '["self-hosted", "prod"]') }}
    continue-on-error: false
    environment: ${{ inputs.environment }}
    env:
      DEPLOYMENT_NAME: ${{ vars.ACL_DEPLOYMENT_NAME }}
      KMS_URL: https://${{ vars.ACL_DEPLOYMENT_NAME }}.confidential-ledger.azure.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install runner prerequisites
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl jq
          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate environment configuration
        run: |
          if [ -z "$DEPLOYMENT_NAME" ]; then
            echo >&2 "Error: set ACL_DEPLOYMENT_NAME on GitHub Environment '${{ inputs.environment }}'"
            exit 1
          fi

      - name: Download KMS service certificate
        run: |
          export KMS_SERVICE_CERT_PATH="${GITHUB_WORKSPACE}/service_cert.pem"
          echo "KMS_SERVICE_CERT_PATH=$KMS_SERVICE_CERT_PATH" >> $GITHUB_ENV
          curl -sSf "https://identity.confidential-ledger.core.azure.com/ledgerIdentity/${DEPLOYMENT_NAME}" \
            | jq -r '.ledgerTlsCertificate' > "${KMS_SERVICE_CERT_PATH}"

      - name: Update KMS application
        env:
          KMS_SERVICE_CERT_PATH: ${{ env.KMS_SERVICE_CERT_PATH }}
        run: make js-app-set
