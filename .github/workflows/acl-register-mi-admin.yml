name: Register automation MI on ACL

permissions:
  id-token: write
  contents: read

# Registers the GitHub Environment automation MI (AZURE_CLIENT_ID) as an ACL
# ledger Administrator so app update / refresh workflows can call protected endpoints.
#
# GitHub Environment (UAT, Production):
#   Variables: ACL_DEPLOYMENT_NAME
#   Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# For first-time registration on a ledger, the automation MI is not yet an ACL
# Administrator. Set use_bootstrap_admin=true and configure on that environment:
#   ACL_LEDGER_ADMIN_CLIENT_ID
#   ACL_LEDGER_ADMIN_TENANT_ID
#   ACL_LEDGER_ADMIN_SUBSCRIPTION_ID
# (a federated identity that is already ACL Administrator on the ledger, e.g. the
# identity used when the ledger was created).
#
# Runners: self-hosted `uat` | `prod`

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Target Environment"
        options:
          - UAT
          - Production
        default: UAT
      use_bootstrap_admin:
        type: boolean
        description: >
          Log in with ACL_LEDGER_ADMIN_* secrets to register the automation MI.
          Required the first time the automation MI is added to a ledger.
        default: true
      principal_object_id:
        type: string
        description: >
          Optional AAD object id to register. Leave empty to use the automation
          MI from AZURE_CLIENT_ID.
        required: false
        default: ""

jobs:
  register-mi:
    name: Register MI — ${{ inputs.environment }}
    runs-on: ${{ fromJSON((inputs.environment || 'UAT') == 'UAT' && '["self-hosted", "uat"]' || '["self-hosted", "prod"]') }}
    continue-on-error: false
    environment: ${{ inputs.environment }}
    env:
      DEPLOYMENT_NAME: ${{ vars.ACL_DEPLOYMENT_NAME }}
      KMS_URL: https://${{ vars.ACL_DEPLOYMENT_NAME }}.confidential-ledger.azure.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runner prerequisites
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl jq
          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi

      - name: Log into Azure (bootstrap admin)
        if: inputs.use_bootstrap_admin
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ACL_LEDGER_ADMIN_CLIENT_ID }}
          tenant-id: ${{ secrets.ACL_LEDGER_ADMIN_TENANT_ID }}
          subscription-id: ${{ secrets.ACL_LEDGER_ADMIN_SUBSCRIPTION_ID }}

      - name: Log into Azure (automation MI)
        if: ${{ !inputs.use_bootstrap_admin }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate environment configuration
        env:
          ACL_LEDGER_ADMIN_CLIENT_ID: ${{ secrets.ACL_LEDGER_ADMIN_CLIENT_ID }}
          ACL_LEDGER_ADMIN_TENANT_ID: ${{ secrets.ACL_LEDGER_ADMIN_TENANT_ID }}
          ACL_LEDGER_ADMIN_SUBSCRIPTION_ID: ${{ secrets.ACL_LEDGER_ADMIN_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$DEPLOYMENT_NAME" ]; then
            echo >&2 "Error: set ACL_DEPLOYMENT_NAME on GitHub Environment '${{ inputs.environment }}'"
            exit 1
          fi
          if [ "${{ inputs.use_bootstrap_admin }}" = "true" ]; then
            if [ -z "$ACL_LEDGER_ADMIN_CLIENT_ID" ] || [ -z "$ACL_LEDGER_ADMIN_TENANT_ID" ] || [ -z "$ACL_LEDGER_ADMIN_SUBSCRIPTION_ID" ]; then
              echo >&2 "Error: set ACL_LEDGER_ADMIN_CLIENT_ID, ACL_LEDGER_ADMIN_TENANT_ID, and ACL_LEDGER_ADMIN_SUBSCRIPTION_ID on GitHub Environment '${{ inputs.environment }}'"
              exit 1
            fi
          fi

      - name: Download KMS service certificate
        run: |
          export KMS_SERVICE_CERT_PATH="${GITHUB_WORKSPACE}/service_cert.pem"
          echo "KMS_SERVICE_CERT_PATH=$KMS_SERVICE_CERT_PATH" >> "$GITHUB_ENV"
          curl -sSf "https://identity.confidential-ledger.core.azure.com/ledgerIdentity/${DEPLOYMENT_NAME}" \
            | jq -r '.ledgerTlsCertificate' > "${KMS_SERVICE_CERT_PATH}"

      - name: Resolve principal object id
        id: principal
        env:
          AUTOMATION_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PRINCIPAL_OBJECT_ID: ${{ inputs.principal_object_id }}
        run: |
          if [ -n "$PRINCIPAL_OBJECT_ID" ]; then
            object_id="$PRINCIPAL_OBJECT_ID"
          else
            object_id="$(az ad sp show --id "$AUTOMATION_CLIENT_ID" --query id --output tsv)"
            if [ -z "$object_id" ]; then
              echo >&2 "Error: could not resolve object id for AZURE_CLIENT_ID"
              exit 1
            fi
          fi
          echo "object_id=$object_id" >> "$GITHUB_OUTPUT"
          echo "Registering principal object id: $object_id"

      - name: Register automation MI as ACL Administrator
        env:
          PRINCIPAL_OBJECT_ID: ${{ steps.principal.outputs.object_id }}
        run: |
          set -euo pipefail
          BEARER_TOKEN="$(az account get-access-token \
            --resource https://confidential-ledger.azure.com \
            --query accessToken --output tsv)"

          response="$(mktemp)"
          http_code="$(
            curl -sS --cacert "${KMS_SERVICE_CERT_PATH}" \
              -X PATCH \
              -H "Content-Type: application/merge-patch+json" \
              -H "Authorization: Bearer ${BEARER_TOKEN}" \
              -d "$(jq -n --arg object_id "$PRINCIPAL_OBJECT_ID" '{
                user_id: $object_id,
                assignedRoles: ["Administrator"]
              }')" \
              -o "$response" \
              -w '%{http_code}' \
              "${KMS_URL}/app/ledgerUsers/${PRINCIPAL_OBJECT_ID}?api-version=2024-08-22-preview"
          )"

          echo "HTTP ${http_code}"
          jq . "$response"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo >&2 "Failed to register Administrator role on ledger ${DEPLOYMENT_NAME}"
            exit 1
          fi

          if jq -e '.error' "$response" >/dev/null 2>&1; then
            echo >&2 "Ledger returned an error payload"
            exit 1
          fi

      - name: Verify Administrator role
        env:
          PRINCIPAL_OBJECT_ID: ${{ steps.principal.outputs.object_id }}
        run: |
          set -euo pipefail
          BEARER_TOKEN="$(az account get-access-token \
            --resource https://confidential-ledger.azure.com \
            --query accessToken --output tsv)"

          response="$(curl -sS --cacert "${KMS_SERVICE_CERT_PATH}" \
            -H "Authorization: Bearer ${BEARER_TOKEN}" \
            "${KMS_URL}/app/ledgerUsers/${PRINCIPAL_OBJECT_ID}?api-version=2024-08-22-preview")"

          echo "$response" | jq .

          if ! echo "$response" | jq -e '.assignedRoles[] | select(. == "Administrator")' >/dev/null; then
            echo >&2 "Verification failed: Administrator role not present for ${PRINCIPAL_OBJECT_ID}"
            exit 1
          fi

          echo "Verified: ${PRINCIPAL_OBJECT_ID} has Administrator on ${DEPLOYMENT_NAME}"
