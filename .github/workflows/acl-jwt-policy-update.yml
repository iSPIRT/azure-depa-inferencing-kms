name: Update JWT validation policy

permissions:
  id-token: write
  contents: read

# Each GitHub Environment (UAT, Production) should define:
#   Variables:
#     ACL_DEPLOYMENT_NAME — Confidential Ledger deployment name (same as ACL / KMS ledger id)
#     KMS_URL             — HTTPS origin for the KMS app (no path), reachable from the runner
#   Secrets:
#     AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID — federated login for automation
#     AZURE_KEY_VAULT_NAME — vault holding the member cert for proposal signing
#
# Runners: use self-hosted agents labeled `uat` or `prod` so they can reach private Key Vault
# and Confidential Ledger like other ACL workflows (similar to depa-inferencing kms_policy_update).
#
# jwt_issuer_trust skips ledger CA / jwt_issuer governance proposals when ACL_DEPLOYMENT_NAME
# resolves via identity.confidential-ledger.core.azure.com (same as ledger name), even if
# KMS_URL is a custom hostname.

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "GitHub Environment"
        options:
          - UAT
          - Production
        default: Production
      trust_type:
        type: choice
        description: "How to derive the JWT validation policy"
        options:
          - managed-identity # MI from Azure
          - managed-identity-v1 # MI from Azure with v1 API
          - aad # AAD token
          - token # Custom JWT token
        default: managed-identity
      managed_identity_resource_id:
        type: string
        description: "ARM resource id of the UAMI (optional if mi_tenant_id + mi_principal_id are set, for v1 API)"
        required: false
        default: ""
      mi_tenant_id:
        type: string
        description: "Tenant ID of the client MI (e.g. virtual node / cleanroom identity)"
        required: false
        default: ""
      mi_principal_id:
        type: string
        description: "Principal (object) id of the MI"
        required: false
        default: ""
      jwt_token:
        type: string
        description: "Sample JWT to copy claims from (required when trust_type is token)"
        required: false
        default: ""

  workflow_call:
    inputs:
      environment:
        type: string
        description: "GitHub Environment"
        default: Production
      trust_type:
        type: string
        description: "Identity type"
        default: managed-identity
      managed_identity_resource_id:
        type: string
        description: "ARM resource id of the UAMI (optional if mi_tenant_id + mi_principal_id set, for v1 API)"
        required: false
        default: ""
      mi_tenant_id:
        type: string
        required: false
        default: ""
      mi_principal_id:
        type: string
        required: false
        default: ""
      jwt_token:
        type: string
        required: false
        default: ""

jobs:
  update-jwt-policy:
    name: JWT policy — ${{ inputs.environment }}
    runs-on: ${{ fromJSON(inputs.environment == 'UAT' && '["self-hosted", "uat"]' || '["self-hosted", "prod"]') }}
    environment: ${{ inputs.environment }}
    continue-on-error: false
    env:
      DEPLOYMENT_NAME: ${{ vars.ACL_DEPLOYMENT_NAME }}
      KMS_URL: ${{ vars.KMS_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.12
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-venv

      - name: Setup Python virtual environment
        run: |
          python3 -m venv ccf_env
          source ccf_env/bin/activate
          pip install --upgrade pip
          pip install ccf==6.0.10
          echo "ccf_env/bin" >> $GITHUB_PATH

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: pip3 install -r requirements.txt

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup workspace paths
        run: |
          export KMS_WORKSPACE=~/$DEPLOYMENT_NAME.aclworkspace
          mkdir -p "$KMS_WORKSPACE/proposals"
          echo "KMS_WORKSPACE=$KMS_WORKSPACE" >> $GITHUB_ENV
          echo "KMS_SERVICE_CERT_PATH=${GITHUB_WORKSPACE}/service_cert.pem" >> $GITHUB_ENV
          echo "KMS_MEMBER_CERT_PATH=$KMS_WORKSPACE/member_cert.pem" >> $GITHUB_ENV

      - name: Validate environment configuration
        env:
          TRUST_TYPE: ${{ inputs.trust_type }}
          MANAGED_IDENTITY_RESOURCE_ID: ${{ inputs.managed_identity_resource_id }}
          MI_TENANT_ID: ${{ inputs.mi_tenant_id }}
          MI_PRINCIPAL_ID: ${{ inputs.mi_principal_id }}
          JWT_TOKEN: ${{ inputs.jwt_token }}
        run: |
          if [ -z "$DEPLOYMENT_NAME" ] || [ -z "$KMS_URL" ]; then
            echo "Error: set ACL_DEPLOYMENT_NAME and KMS_URL on GitHub Environment '${{ inputs.environment }}'"
            exit 1
          fi

          case "${TRUST_TYPE}" in
            token)
              if [ -z "$JWT_TOKEN" ]; then
                echo "Error: jwt_token is required when trust_type is token"
                exit 1
              fi
              ;;
            aad)
              ;;
            managed-identity|managed-identity-v1)
              if [ -n "$MANAGED_IDENTITY_RESOURCE_ID" ]; then
                :
              elif [ -n "$MI_TENANT_ID" ] && [ -n "$MI_PRINCIPAL_ID" ]; then
                :
              else
                echo "Error: for ${TRUST_TYPE} provide managed_identity_resource_id, or both mi_tenant_id and mi_principal_id"
                exit 1
              fi
              ;;
            *)
              echo "Error: unknown trust_type ${TRUST_TYPE}"
              exit 1
              ;;
          esac

      - name: Fetch ledger TLS certificate
        run: |
          curl -sSf "https://identity.confidential-ledger.core.azure.com/ledgerIdentity/${DEPLOYMENT_NAME}" \
            | jq -r '.ledgerTlsCertificate' > "${KMS_SERVICE_CERT_PATH}"

      - name: Download member certificate from Key Vault
        env:
          AKV_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
        run: |
          # Self-hosted runners reuse ~/…aclworkspace; az refuses to overwrite an existing --file
          mkdir -p "$(dirname "${KMS_MEMBER_CERT_PATH}")"
          rm -f "${KMS_MEMBER_CERT_PATH}"
          az keyvault certificate download \
            --file "${KMS_MEMBER_CERT_PATH}" \
            --vault-name "$AKV_VAULT_NAME" \
            --name "${DEPLOYMENT_NAME}-member-cert"

      - name: Update JWT validation policy
        env:
          USE_AKV: "true"
          AKV_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          AKV_KEY_NAME: ${{ vars.ACL_DEPLOYMENT_NAME }}-member-cert
          TRUST_TYPE: ${{ inputs.trust_type }}
          MANAGED_IDENTITY_RESOURCE_ID: ${{ inputs.managed_identity_resource_id }}
          MI_TENANT_ID: ${{ inputs.mi_tenant_id }}
          MI_PRINCIPAL_ID: ${{ inputs.mi_principal_id }}
          JWT_TOKEN: ${{ inputs.jwt_token }}
        run: |
          set -euo pipefail
          case "${TRUST_TYPE}" in
            aad)
              export JWT_TRUST_TYPE="--aad"
              export JWT_TRUST_ARGS=""
              ;;
            token)
              export JWT_TRUST_TYPE="--token"
              export JWT_TRUST_ARGS="${JWT_TOKEN}"
              ;;
            managed-identity-v1)
              if [ -n "${MANAGED_IDENTITY_RESOURCE_ID}" ]; then
                export JWT_TRUST_TYPE="--managed-identity-v1"
                export JWT_TRUST_ARGS="${MANAGED_IDENTITY_RESOURCE_ID}"
              else
                export JWT_TRUST_TYPE="--managed-identity-by-ids-v1"
                export JWT_TRUST_ARGS="${MI_TENANT_ID} ${MI_PRINCIPAL_ID}"
              fi
              ;;
            managed-identity|*)
              if [ -n "${MANAGED_IDENTITY_RESOURCE_ID}" ]; then
                export JWT_TRUST_TYPE="--managed-identity"
                export JWT_TRUST_ARGS="${MANAGED_IDENTITY_RESOURCE_ID}"
              else
                export JWT_TRUST_TYPE="--managed-identity-by-ids"
                export JWT_TRUST_ARGS="${MI_TENANT_ID} ${MI_PRINCIPAL_ID}"
              fi
              ;;
          esac
          make jwt-issuer-trust

      - name: Show JWT validation policy
        run: |
          echo "=== Current JWT validation policy ==="
          curl -sSf "${KMS_URL}/app/jwtValidationPolicy" \
            --cacert "${KMS_SERVICE_CERT_PATH}" \
            -H "Content-Type: application/json" | jq .
