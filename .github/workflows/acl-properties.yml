name: Get KMS properties

permissions:
  id-token: write
  contents: read

# GitHub Environment (UAT, Production):
#   Variables: ACL_DEPLOYMENT_NAME
#   Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Runners: self-hosted `uat` | `prod`. KMS host: https://{ACL_DEPLOYMENT_NAME}.confidential-ledger.azure.com

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Target Environment"
        options:
          - UAT
          - Production
        default: Production
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Target Environment"
        default: Production

jobs:
  deploy:
    name: KMS properties — ${{ inputs.environment }}
    runs-on: ${{ fromJSON((inputs.environment || 'Production') == 'UAT' && '["self-hosted", "uat"]' || '["self-hosted", "prod"]') }}
    continue-on-error: false
    environment: ${{ inputs.environment }}
    env:
      DEPLOYMENT_NAME: ${{ vars.ACL_DEPLOYMENT_NAME }}
      KMS_URL: https://${{ vars.ACL_DEPLOYMENT_NAME }}.confidential-ledger.azure.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runner prerequisites
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl jq
          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate environment configuration
        run: |
          if [ -z "$DEPLOYMENT_NAME" ]; then
            echo >&2 "Error: set ACL_DEPLOYMENT_NAME on GitHub Environment '${{ inputs.environment }}'"
            exit 1
          fi

      - name: Get service certificate
        run: |
          curl -sSf "https://identity.confidential-ledger.core.azure.com/ledgerIdentity/${DEPLOYMENT_NAME}" \
            | jq -r '.ledgerTlsCertificate' > "${GITHUB_WORKSPACE}/service_cert.pem"

      - name: List ledger users
        run: |
          BEARER_TOKEN=$(az account get-access-token --resource https://confidential-ledger.azure.com --query accessToken --output tsv)
          echo "Listing all users in the ledger:"
          export KMS_SERVICE_CERT_PATH="${GITHUB_WORKSPACE}/service_cert.pem"
          curl -sSf "${KMS_URL}/app/ledgerUsers?api-version=2024-08-22-preview" \
            --cacert "${KMS_SERVICE_CERT_PATH}" \
            -H "Authorization: Bearer ${BEARER_TOKEN}" | jq .

      - name: Get policies
        run: |
          export KMS_SERVICE_CERT_PATH="${GITHUB_WORKSPACE}/service_cert.pem"
          export TOKEN=$(az account get-access-token --resource https://confidential-ledger.azure.com | jq -r '.accessToken')
          curl -sSf "${KMS_URL}/app/keyReleasePolicy" --cacert "${KMS_SERVICE_CERT_PATH}" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" | jq
          curl -sSf "${KMS_URL}/app/settingsPolicy" --cacert "${KMS_SERVICE_CERT_PATH}" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" | jq
          curl -sSf "${KMS_URL}/app/jwtValidationPolicy" --cacert "${KMS_SERVICE_CERT_PATH}" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" | jq

      - name: Get public keys
        run: |
          export KMS_SERVICE_CERT_PATH="${GITHUB_WORKSPACE}/service_cert.pem"
          curl -sSf "${KMS_URL}/app/listpubkeys" --cacert "${KMS_SERVICE_CERT_PATH}" \
            -H "Content-Type: application/json" | jq
