name: Update key release policy claims

permissions:
  id-token: write
  contents: read

# GitHub Environment (UAT, Production):
#   Variables: ACL_DEPLOYMENT_NAME (ledger name)
#   Secrets: AZURE_*, AZURE_KEY_VAULT_NAME
# Runners: self-hosted `uat` | `prod`. KMS host: https://{ACL_DEPLOYMENT_NAME}.confidential-ledger.azure.com

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: "Target Environment"
        options:
          - UAT
          - Production
        default: Production
      operation:
        type: choice
        description: "Whether to add or remove the specified claims"
        options:
          - add
          - remove
        default: add
      service:
        type: string
        description: "Service name in the key release policy"
        default: "depa-inferencing"
      claims_json:
        type: string
        description: >
          JSON object of claims to add or remove.
          Example: {"x-ms-ver": ["2","3"], "x-ms-sevsnpvm-is-debuggable": false}
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Target Environment"
        default: Production
      operation:
        type: string
        description: "add or remove"
        default: add
      service:
        type: string
        description: "Service name in the key release policy"
        default: depa-inferencing
      claims_json:
        type: string
        description: JSON object of claims to add or remove
        required: true

jobs:
  update-key-release-policy:
    name: key release — ${{ inputs.environment }}
    runs-on: ${{ fromJSON((inputs.environment || 'Production') == 'UAT' && '["self-hosted", "uat"]' || '["self-hosted", "prod"]') }}
    continue-on-error: false
    environment: ${{ inputs.environment }}
    env:
      DEPLOYMENT_NAME: ${{ vars.ACL_DEPLOYMENT_NAME }}
      KMS_URL: https://${{ vars.ACL_DEPLOYMENT_NAME }}.confidential-ledger.azure.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python and CLI prerequisites
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-venv ca-certificates curl jq
          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi

      - name: Setup Python virtual environment
        run: |
          python3.12 -m venv ccf_env
          source ccf_env/bin/activate
          pip install --upgrade pip
          pip install ccf==6.0.10
          echo "ccf_env/bin" >> $GITHUB_PATH

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: pip3 install -r requirements.txt

      - name: Log into Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate environment configuration
        run: |
          if [ -z "$DEPLOYMENT_NAME" ]; then
            echo >&2 "Error: set ACL_DEPLOYMENT_NAME on GitHub Environment '${{ inputs.environment }}'"
            exit 1
          fi

      - name: Setup workspace paths
        run: |
          export KMS_WORKSPACE=~/$DEPLOYMENT_NAME.aclworkspace
          mkdir -p "$KMS_WORKSPACE/proposals"
          echo "KMS_WORKSPACE=$KMS_WORKSPACE" >> $GITHUB_ENV
          echo "KMS_SERVICE_CERT_PATH=${GITHUB_WORKSPACE}/service_cert.pem" >> $GITHUB_ENV
          echo "KMS_MEMBER_CERT_PATH=$KMS_WORKSPACE/member_cert.pem" >> $GITHUB_ENV

      - name: Get service certificate
        run: |
          curl -sSf "https://identity.confidential-ledger.core.azure.com/ledgerIdentity/${DEPLOYMENT_NAME}" \
            | jq -r '.ledgerTlsCertificate' > "${KMS_SERVICE_CERT_PATH}"

      - name: Download member certificate from Key Vault
        env:
          AKV_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
        run: |
          mkdir -p "$(dirname "${KMS_MEMBER_CERT_PATH}")"
          rm -f "${KMS_MEMBER_CERT_PATH}"
          az keyvault certificate download \
            --file "${KMS_MEMBER_CERT_PATH}" \
            --vault-name "$AKV_VAULT_NAME" \
            --name "${DEPLOYMENT_NAME}-member-cert"

      - name: Validate claims JSON
        env:
          CLAIMS_JSON: ${{ inputs.claims_json }}
        run: |
          echo "$CLAIMS_JSON" | jq . > /dev/null || \
            (echo "ERROR: claims_json is not valid JSON" && exit 1)

      - name: Build key release policy proposal
        env:
          OPERATION: ${{ inputs.operation }}
          SERVICE: ${{ inputs.service }}
          CLAIMS_JSON: ${{ inputs.claims_json }}
        run: |
          PROPOSAL_PATH="${GITHUB_WORKSPACE}/governance/proposals/key_release_policy_update.json"
          jq -n \
            --arg service "$SERVICE" \
            --arg type "$OPERATION" \
            --argjson claims "$CLAIMS_JSON" \
            '{
              actions: [{
                name: "set_key_release_policy",
                args: {
                  service: $service,
                  type: $type,
                  claims: $claims
                }
              }]
            }' > "${PROPOSAL_PATH}"

          echo "Generated proposal:"
          jq . "${PROPOSAL_PATH}"

      - name: Apply key release policy update
        env:
          KMS_WORKSPACE: ${{ env.KMS_WORKSPACE }}
          KMS_SERVICE_CERT_PATH: ${{ env.KMS_SERVICE_CERT_PATH }}
          KMS_MEMBER_CERT_PATH: ${{ env.KMS_MEMBER_CERT_PATH }}
          USE_AKV: "true"
          AKV_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          AKV_KEY_NAME: ${{ vars.ACL_DEPLOYMENT_NAME }}-member-cert
        run: |
          make release-policy-set \
            release-policy-proposal=governance/proposals/key_release_policy_update.json

      - name: Verify updated key release policy
        run: |
          export TOKEN=$(az account get-access-token \
            --resource https://confidential-ledger.azure.com | jq -r '.accessToken')
          echo "Current key release policy:"
          curl -sSf "${KMS_URL}/app/keyReleasePolicy" \
            --cacert "${KMS_SERVICE_CERT_PATH}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" | jq
